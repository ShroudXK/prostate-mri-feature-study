[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prostate-mri-feature-study"
version = "0.1.0"
description = "Auditable exploratory analysis and pathology-linked modeling workflow for prostate MRI features"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
